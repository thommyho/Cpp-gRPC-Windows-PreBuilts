{% extends "base.html" %}

{% block footer %}
{{ super() }}

  <div class="footer-commit">
    <span class="commit-msg">Latest commit:</span>

    <a href="{{ config.extra.commit_url }}"
       target="_blank"
       rel="noopener">
      <span class="commit-sha">{{ config.extra.commit_sha }}</span>
    </a>

    <span class="commit-title">
      {{ config.extra.commit_message }}
    </span>
  </div>
{% endblock %}
